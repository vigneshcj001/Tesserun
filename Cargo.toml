[package]
name = "tesserun"
version = "0.3.0"
edition = "2024"
default-run = "tesserun"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "tesserun"
path = "rust/main.rs"
required-features = ["native"]

[[bin]]
name = "tesserun-server"
path = "rust/bin/server.rs"

[features]
default = ["native"]
native = ["dep:eframe"]

[dependencies]
anyhow = "1"
base64 = "0.22.1"
axum = "0.8.9"
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

